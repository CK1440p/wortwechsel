<!DOCTYPE html>

<head>

  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0e111c" id="theme-color">
  <meta name="description" content="Vokabeln, Dialoge und Fragenkataloge für jedes Fach lernen und Tests simulieren.">
  <title>Wortwechsel · Dein Lerntrainer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion-theme.css">
  <link rel="stylesheet" href="subjects.css">
  <link rel="stylesheet" href="hover.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="core.js" defer></script>
  <script src="seed.js" defer></script>
  <script src="app.js" defer></script>
  <script src="effects.js" defer></script>
  <script src="hover.js" defer></script>
  <script src="mobile.js" defer></script>
  <script src="vendor/supabase.js" defer></script>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <a href="#" class="brand" aria-label="Wortwechsel Startseite"><span class="brand-symbol">w<span>↗</span></span><span>wortwechsel<span class="brand-dot">.</span></span></a>
      <div class="workspace-label">DEINE FÄCHER <span>✦</span></div>
      <div class="subject-switch" id="subject-switch" role="tablist" aria-label="Fach wählen"></div>
      <nav>
        <div class="nav-group" id="nav-vocab">
          <button class="nav-item active" data-view="library" data-short="Sets"><span data-icon="grid"></span>Meine Lernsets<span class="nav-count" id="set-count">1</span></button>
          <button class="nav-item" id="nav-practice" data-short="Lernen"><span data-icon="spark"></span>Weiterlernen</button>
          <button class="nav-item" data-view="dialogs" data-short="Dialoge"><span data-icon="chat"></span>Dialoge</button>
          <button class="nav-item" data-view="grammar" data-short="Grammatik"><span data-icon="table"></span>Grammatik</button>
          <button class="nav-item" data-view="catalogs" id="nav-vocab-catalogs" data-short="Kataloge" hidden><span data-icon="book"></span>Fragenkataloge</button>
          <button class="nav-item" id="nav-import" data-short="Neu"><span data-icon="plus"></span>Lernset erstellen</button>
        </div>
        <div class="nav-group" id="nav-qa" hidden>
          <button class="nav-item" data-view="catalogs" data-short="Übersicht"><span data-icon="grid"></span>Übersicht</button>
          <button class="nav-item" id="nav-qa-learn" data-short="Lernen"><span data-icon="spark"></span>Weiterlernen</button>
          <button class="nav-item" id="nav-qa-test" data-short="Test"><span data-icon="clock"></span>Test simulieren</button>
          <button class="nav-item" id="nav-qa-new" data-short="Neu"><span data-icon="plus"></span>Katalog erstellen</button>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="backup-btn"><span data-icon="download"></span>Sicherung exportieren</button>
        <div class="local-note"><span class="status-dot"></span>Auf diesem Gerät gespeichert</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb">Dein Lernraum <span>/</span> <strong>Meine Lernsets</strong></div><div class="topbar-right"><button class="icon-button theme-toggle" id="theme-toggle" aria-label="Farbschema wechseln" aria-pressed="true"><svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg><svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg></button><button class="account-button" id="account-btn" type="button" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Anmelden</span></button><button class="icon-button" id="top-settings" aria-label="Lerneinstellungen" title="Lerneinstellungen"><span data-icon="settings"></span></button></div></header>
      <div id="storage-warning" class="storage-warning" hidden>Dein Browser kann gerade nichts speichern. Lass die Seite offen und exportiere eine Sicherung, damit nichts verloren geht.</div>
      <main id="main" tabindex="-1"></main>

    </div>
  </div>
  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-heading"></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-heading"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-heading"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

</html>
