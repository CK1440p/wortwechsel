<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3758ed">
  <meta name="description" content="Vokabellisten importieren und üben, Dialoge mit immer weniger Hilfe auswendig schreiben.">
  <title>Wortwechsel · Dein Vokabeltrainer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion-theme.css">
  <script src="core.js" defer></script>
  <script src="seed.js" defer></script>
  <script src="app.js" defer></script>
  <script src="effects.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <a href="#" class="brand" aria-label="Wortwechsel Startseite"><span class="brand-symbol">w<span>↗</span></span><span>wortwechsel<span class="brand-dot">.</span></span></a>
      <div class="workspace-label">DEIN LERNRAUM <span>✦</span></div>
      <nav>
        <button class="nav-item active" data-view="library"><span data-icon="grid"></span>Meine Lernsets<span class="nav-count" id="set-count">1</span></button>
        <button class="nav-item" id="nav-practice"><span data-icon="spark"></span>Weiterlernen</button>
        <button class="nav-item" data-view="dialogs"><span data-icon="chat"></span>Dialoge</button>
        <button class="nav-item" id="nav-import"><span data-icon="plus"></span>Lernset erstellen</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="backup-btn"><span data-icon="download"></span>Sicherung exportieren</button>
        <div class="local-note"><span class="status-dot"></span>Auf diesem Gerät gespeichert</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb">Dein Lernraum <span>/</span> <strong>Meine Lernsets</strong></div><div class="topbar-right"><button class="icon-button theme-toggle" id="theme-toggle" aria-label="Farbschema wechseln" aria-pressed="true"><svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg><svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg></button><span class="private-badge"><span data-icon="lock"></span> Nur für dich</span><button class="icon-button" id="top-settings" aria-label="Lerneinstellungen" title="Lerneinstellungen"><span data-icon="settings"></span></button></div></header>
      <div id="storage-warning" class="storage-warning" hidden>Dein Browser kann gerade nichts speichern. Lass die Seite offen und exportiere eine Sicherung, damit nichts verloren geht.</div>
      <main id="main" tabindex="-1"></main>

    </div>
  </div>
  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-heading"></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-heading"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-heading"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
